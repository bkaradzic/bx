name: CI

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  msvc:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { config: Debug,   platform: x64,   runs-on: windows-latest, bindir: 'win64_vs2022', genie-action: 'vs2022', solution-ext: 'sln' },
          { config: Release, platform: x64,   runs-on: windows-latest, bindir: 'win64_vs2022', genie-action: 'vs2022', solution-ext: 'sln' },
          { config: Debug,   platform: ARM64, runs-on: windows-11-arm, bindir: 'arm64_vs2022', genie-action: 'vs2022', solution-ext: 'sln' },
          { config: Release, platform: ARM64, runs-on: windows-11-arm, bindir: 'arm64_vs2022', genie-action: 'vs2022', solution-ext: 'sln' },
#          { config: Debug,   platform: x64, bindir: 'win64_vs2026', genie-action: 'vs2026', solution-ext: 'slnx' },
#          { config: Release, platform: x64, bindir: 'win64_vs2026', genie-action: 'vs2026', solution-ext: 'slnx' },
        ]
    name: msvc-${{ matrix.config }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - name: Prepare
        uses: microsoft/setup-msbuild@v2
      - name: Build
        shell: cmd
        run: |
          cd bx
          tools\bin\windows\genie.exe ${{ matrix.genie-action }}
          msbuild ".build/projects/${{ matrix.genie-action }}/bx.${{ matrix.solution-ext }}" /m /v:minimal /p:Configuration=${{ matrix.config }} /p:Platform=${{ matrix.platform }}
      - name: Check
        shell: cmd
        run: |
          cd bx
          ".build\${{ matrix.bindir }}\bin\bx.test${{ matrix.config }}.exe" -d yes
  mingw:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { msystem: MINGW64, project: 'mingw-gcc',   bindir: 'win64_mingw-gcc'   },
          { msystem: CLANG64, project: 'mingw-clang', bindir: 'win64_mingw-clang' },
        ]
    name: mingw-${{ matrix.msystem }}
    runs-on: windows-2022
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - name: Prepare
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make
          pacboy: cc:p
      - name: Build
        shell: msys2 {0}
        run: |
          cd bx
          tools/bin/windows/genie.exe --gcc=${{ matrix.project }} gmake
          make -R -C .build/projects/gmake-${{ matrix.project }} config=release64 -j$(nproc) AR=ar CC=cc CXX=c++ MINGW=$MINGW_PREFIX
      - name: Check
        shell: cmd
        run: |
          cd bx
          ".build\${{ matrix.bindir }}\bin\bx.testRelease.exe" -d yes
  linux:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { compiler: gcc,   genie: linux-gcc,   bindir: linux64_gcc,   config: debug,   binsuffix: Debug   },
          { compiler: gcc,   genie: linux-gcc,   bindir: linux64_gcc,   config: release, binsuffix: Release },
          { compiler: clang, genie: linux-clang, bindir: linux64_clang, config: debug,   binsuffix: Debug   },
          { compiler: clang, genie: linux-clang, bindir: linux64_clang, config: release, binsuffix: Release },
        ]
    name: linux-${{ matrix.compiler }}-${{ matrix.config }}64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - name: Build
        run: |
          cd bx
          tools/bin/linux/genie --gcc=${{ matrix.genie }} gmake
          make -R -C .build/projects/gmake-${{ matrix.genie }} config=${{ matrix.config }}64 -j$(nproc)
      - name: Check
        run: |
          cd bx
          ".build/${{ matrix.bindir }}/bin/bx.test${{ matrix.binsuffix }}" -d yes
  osx:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { runs-on: macos-15, arch: osx-arm64, bindir: osx-arm64, config: debug,   binsuffix: Debug   },
          { runs-on: macos-15, arch: osx-arm64, bindir: osx-arm64, config: release, binsuffix: Release },
        ]
    name: osx-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - name: Build
        run: |
          cd bx
          tools/bin/darwin/genie --gcc=${{ matrix.arch }} gmake
          make -C .build/projects/gmake-${{ matrix.arch }} config=${{ matrix.config }} -j$(sysctl -n hw.physicalcpu)
      - name: Check
        run: |
          cd bx
          ".build/${{ matrix.bindir }}/bin/bx.test${{ matrix.binsuffix }}" -d yes
  android:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { project: android-arm,   bindir: android-arm   },
          { project: android-arm64, bindir: android-arm64 },
        ]
    name: ${{ matrix.project }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ARM: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ARM64: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd bx
          tools/bin/linux/genie --gcc=${{ matrix.project }} gmake
          make -R -C .build/projects/gmake-${{ matrix.project }} config=release -j$(nproc)
  emscripten:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { config: debug, binsuffix: Debug },
          { config: release, binsuffix: Release },
        ]
    name: wasm-${{ matrix.config }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache
      - uses: browser-actions/setup-chrome@v1
      - name: Build
        run: |
          cd bx
          tools/bin/linux/genie --gcc=wasm gmake
          make -C .build/projects/gmake-wasm config=${{ matrix.config }} -j$(nproc) EMSCRIPTEN=$EMSDK/upstream/emscripten
      - name: Check
        run: |
          cd bx
#          npx http-server -o .build/wasm/bin/ & chromium http://127.0.0.1:8080/.build/wasm/bin/bx.testRelease.html
  amalgamated:
    strategy:
      fail-fast: true
      matrix:
        include: [
          { name: msvc,          runs-on: windows-latest },
          { name: linux-gcc,     runs-on: ubuntu-24.04, os: linux,  config: release64, bindir: linux64_gcc   },
          { name: linux-clang,   runs-on: ubuntu-24.04, os: linux,  config: release64, bindir: linux64_clang },
          { name: osx-arm64,     runs-on: macos-15,     os: darwin, config: release,   bindir: osx-arm64     },
          { name: android-arm64, runs-on: ubuntu-24.04, os: linux,  config: release },
          { name: wasm,          runs-on: ubuntu-24.04, os: linux,  config: release, make-args: 'EMSCRIPTEN=$EMSDK/upstream/emscripten' },
        ]
    name: amalgamated-${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout bx
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          path: bx
      - name: Prepare
        if: matrix.name == 'msvc'
        uses: microsoft/setup-msbuild@v2
      - uses: nttld/setup-ndk@v1
        if: startsWith(matrix.name, 'android')
        id: setup-ndk
        with:
          ndk-version: r27c
      - uses: mymindstorm/setup-emsdk@v14
        if: matrix.name == 'wasm'
        with:
          version: 5.0.2
          actions-cache-folder: emsdk-cache
      - name: Build
        if: matrix.name == 'msvc'
        shell: cmd
        run: |
          cd bx
          tools\bin\windows\genie.exe --with-amalgamated vs2022
          msbuild ".build/projects/vs2022/bx.sln" /m /v:minimal /p:Configuration=Release /p:Platform=x64
      - name: Build
        if: matrix.name != 'msvc'
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ARM: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ARM64: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd bx
          tools/bin/${{ matrix.os }}/genie --with-amalgamated --gcc=${{ matrix.name }} gmake
          make -C .build/projects/gmake-${{ matrix.name }} config=${{ matrix.config }} -j$(getconf _NPROCESSORS_ONLN) ${{ matrix.make-args }}
      - name: Check
        if: matrix.name == 'msvc'
        shell: cmd
        run: |
          cd bx
          ".build\win64_vs2022\bin\bx.testRelease.exe" -d yes
      - name: Check
        if: matrix.bindir
        run: |
          cd bx
          ".build/${{ matrix.bindir }}/bin/bx.testRelease" -d yes
